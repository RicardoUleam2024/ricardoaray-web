    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0D1117 0%, #0a1628 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;

    }

    .card {
      width: 100%;

      text-align: center;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top center;
      border: 3px solid #1D9E75;
      box-shadow: 0 0 24px rgba(29,158,117,0.4);
      margin-bottom: 1.2rem;
    }

    h1 {
      color: #ffffff;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.4rem;

    .bio {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 0.85rem 1.2rem;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }

    .link-btn:hover {
      background: rgba(29,158,117,0.2);
      border-color: #1D9E75;
      transform: translateY(-2px);
    }

    .link-btn .icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .link-btn .label { flex: 1; text-align: left; }
    .link-btn .arrow { color: rgba(255,255,255,0.3); font-size: 0.85rem; }

    .icon-ig   { background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .icon-tt   { background: #000000; }
    .icon-yt   { background: #FF0000; }
    .icon-pp   { background: #003087; }
    .icon-web  { background: #1D9E75; }

    .footer {
      margin-top: 2rem;
      color: rgba(255,255,255,0.2);
      font-size: 0.75rem;
